<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Rust gear pattern -->
    <pattern id="gear-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="20" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.3"/>
      <circle cx="50" cy="50" r="10" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.3"/>
    </pattern>
    
    <!-- Code window shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-gradient)"/>
  <rect width="800" height="600" fill="url(#gear-pattern)"/>
  
  <!-- Title text -->
  <text x="400" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#f8fafc" text-anchor="middle">Rust Development</text>
  <text x="400" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="normal" fill="#94a3b8" text-anchor="middle">Environment Setup</text>
  
  <!-- VS Code Window -->
  <g transform="translate(100, 160)" filter="url(#shadow)">
    <!-- Window frame -->
    <rect x="0" y="0" width="600" height="380" rx="8" ry="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Title bar -->
    <rect x="0" y="0" width="600" height="30" rx="8" ry="8" fill="#0f172a"/>
    <circle cx="20" cy="15" r="6" fill="#ef4444"/>
    <circle cx="40" cy="15" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="15" r="6" fill="#22c55e"/>
    <text x="300" y="20" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">main.rs - hello_rust</text>
    
    <!-- Code area -->
    <rect x="0" y="30" width="600" height="350" fill="#1e293b"/>
    
    <!-- Line numbers -->
    <text x="20" y="60" font-family="monospace" font-size="13" fill="#475569" text-anchor="end">1</text>
    <text x="20" y="85" font-family="monospace" font-size="13" fill="#475569" text-anchor="end">2</text>
    <text x="20" y="110" font-family="monospace" font-size="13" fill="#475569" text-anchor="end">3</text>
    <text x="20" y="135" font-family="monospace" font-size="13" fill="#475569" text-anchor="end">4</text>
    <text x="20" y="160" font-family="monospace" font-size="13" fill="#475569" text-anchor="end">5</text>
    <text x="20" y="185" font-family="monospace" font-size="13" fill="#475569" text-anchor="end">6</text>
    <text x="20" y="210" font-family="monospace" font-size="13" fill="#475569" text-anchor="end">7</text>
    
    <!-- Code content -->
    <text x="50" y="60" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c084fc">fn</text>
    <text x="80" y="60" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#60a5fa">main</text>
    <text x="120" y="60" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0">() {</text>
    
    <text x="50" y="85" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c084fc">let</text>
    <text x="90" y="85" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0"> greeting = </text>
    <text x="220" y="85" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#86efac">"Hello, Rust!"</text>
    <text x="360" y="85" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0">;</text>
    
    <text x="50" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c084fc">let</text>
    <text x="90" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0"> numbers = </text>
    <text x="200" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#fca5a5">vec!</text>
    <text x="240" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0">[</text>
    <text x="250" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#fca5a5">1</text>
    <text x="260" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0">, </text>
    <text x="275" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#fca5a5">2</text>
    <text x="290" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0">, </text>
    <text x="305" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#fca5a5">3</text>
    <text x="320" y="110" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0">];</text>
    
    <text x="50" y="135" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c084fc">for</text>
    <text x="90" y="135" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0"> num </text>
    <text x="140" y="135" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#c084fc">in</text>
    <text x="165" y="135" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0"> &amp;numbers {</text>
    
    <text x="50" y="160" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#94a3b8">        println!</text>
    <text x="160" y="160" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#86efac">"{}"</text>
    <text x="200" y="160" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0">, num);</text>
    
    <text x="50" y="185" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0">    }</text>
    <text x="50" y="210" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#e2e8f0">}</text>
    
    <!-- Inlay hints -->
    <text x="380" y="85" font-family="monospace" font-size="11" fill="#64748b" font-style="italic">&lt;!-- greeting: String --&gt;</text>
    <text x="340" y="110" font-family="monospace" font-size="11" fill="#64748b" font-style="italic">&lt;!-- numbers: Vec&lt;i32&gt; --&gt;</text>
    
    <!-- Cursor blinking -->
    <rect x="330" y="198" width="2" height="18" fill="#e2e8f0" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Tool icons -->
  <g transform="translate(150, 570)">
    <!-- rustup icon -->
    <circle cx="30" cy="15" r="12" fill="#ea580c" opacity="0.9"/>
    <text x="30" y="19" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">R</text>
    
    <!-- cargo icon -->
    <rect x="70" y="5" width="24" height="20" rx="3" fill="#f59e0b" opacity="0.9"/>
    <text x="82" y="19" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">C</text>
    
    <!-- rustc icon -->
    <polygon points="130,5 142,15 130,25" fill="#dc2626" opacity="0.9"/>
    <text x="128" y="19" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">r</text>
  </g>
  
  <!-- Subtitle -->
  <text x="400" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">VS Code + Rust Analyzer + CodeLLDB</text>
</svg>
