<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bg { fill: url(#gradient); }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 46px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 26px; fill: #e0f2fe; text-anchor: middle; }
      .series { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 20px; fill: #bae6fd; text-anchor: middle; }
      .agent-box { fill: rgba(255, 255, 255, 0.15); stroke: #ffffff; stroke-width: 3; rx: 15; ry: 15; }
      .message-line { stroke: #60a5fa; stroke-width: 3; opacity: 0.8; }
      .blackboard { fill: rgba(255, 255, 255, 0.2); stroke: #fbbf24; stroke-width: 3; rx: 10; ry: 10; }
      .arrow { fill: #60a5fa; }
    </style>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>
  
  <!-- Decorative elements - Communication network -->
  <!-- Agent nodes positioned in a circle -->
  <circle cx="300" cy="250" r="50" class="agent-box"/>
  <text x="300" y="250" fill="white" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Agent 1</text>
  
  <circle cx="600" cy="180" r="50" class="agent-box"/>
  <text x="600" y="180" fill="white" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Agent 2</text>
  
  <circle cx="900" cy="250" r="50" class="agent-box"/>
  <text x="900" y="250" fill="white" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Agent 3</text>
  
  <circle cx="450" cy="400" r="50" class="agent-box"/>
  <text x="450" y="400" fill="white" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Agent 4</text>
  
  <circle cx="750" cy="400" r="50" class="agent-box"/>
  <text x="750" y="400" fill="white" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Agent 5</text>
  
  <!-- Message lines between agents -->
  <line x1="340" y1="270" x2="560" y2="200" class="message-line" stroke-dasharray="8,5"/>
  <line x1="640" y1="200" x2="860" y2="270" class="message-line" stroke-dasharray="8,5"/>
  <line x1="340" y1="290" x2="410" y2="370" class="message-line" stroke-dasharray="8,5"/>
  <line x1="860" y1="290" x2="790" y2="370" class="message-line" stroke-dasharray="8,5"/>
  <line x1="490" y1="400" x2="710" y2="400" class="message-line" stroke-dasharray="8,5"/>
  
  <!-- Central Blackboard -->
  <rect x="500" y="280" width="200" height="100" class="blackboard"/>
  <text x="600" y="320" fill="#fbbf24" font-size="20" text-anchor="middle" font-weight="bold">共享黑板</text>
  <text x="600" y="345" fill="#fef3c7" font-size="14" text-anchor="middle">Blackboard</text>
  
  <!-- Lines from agents to blackboard -->
  <line x1="470" y1="380" x2="550" y2="330" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <line x1="730" y1="380" x2="650" y2="330" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <line x1="330" y1="290" x2="520" y2="300" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  <line x1="870" y1="290" x2="680" y2="300" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>
  
  <!-- Series label -->
  <text x="600" y="80" class="series">AI 技术演进与核心算法实战 | 第二十四篇</text>
  
  <!-- Main title -->
  <text x="600" y="500" class="title">通信与共识机制</text>
  
  <!-- Subtitle -->
  <text x="600" y="545" class="subtitle">消息协议 · 共享黑板 · 冲突仲裁算法</text>
  
  <!-- Bottom decorative line -->
  <line x1="300" y1="585" x2="900" y2="585" stroke="#60a5fa" stroke-width="4" opacity="0.5"/>
</svg>
