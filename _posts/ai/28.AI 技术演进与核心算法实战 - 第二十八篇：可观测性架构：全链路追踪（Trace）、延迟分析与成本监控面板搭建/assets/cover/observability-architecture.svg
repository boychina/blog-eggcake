<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Title Card -->
  <rect x="100" y="80" width="1000" height="120" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="16"/>
  <text x="600" y="130" font-family="-apple-system, sans-serif" font-size="48" fill="#0f172a" text-anchor="middle" font-weight="800">可观测性架构</text>
  <text x="600" y="170" font-family="-apple-system, sans-serif" font-size="24" fill="#475569" text-anchor="middle" font-weight="600">全链路追踪 · 延迟分析 · 成本监控</text>
  
  <!-- Three Feature Cards -->
  <!-- Card 1: Tracing -->
  <rect x="100" y="240" width="300" height="300" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="12"/>
  <circle cx="250" cy="300" r="40" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="250" y="310" font-size="32" text-anchor="middle">🔍</text>
  <text x="250" y="370" font-family="-apple-system, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle" font-weight="700">全链路追踪</text>
  <text x="250" y="400" font-family="-apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">OpenTelemetry + Span</text>
  <rect x="140" y="440" width="220" height="30" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
  <text x="250" y="460" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">推理过程可视化</text>
  <rect x="140" y="480" width="220" height="30" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
  <text x="250" y="500" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">分布式调用链</text>
  
  <!-- Card 2: Latency -->
  <rect x="450" y="240" width="300" height="300" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="12"/>
  <circle cx="600" cy="300" r="40" fill="#fecdd3" stroke="#be123c" stroke-width="2"/>
  <text x="600" y="310" font-size="32" text-anchor="middle">⚡</text>
  <text x="600" y="370" font-family="-apple-system, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle" font-weight="700">延迟分解</text>
  <text x="600" y="400" font-family="-apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">P50/P95/P99 + TTFT</text>
  <rect x="490" y="440" width="220" height="30" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
  <text x="600" y="460" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">性能瓶颈定位</text>
  <rect x="490" y="480" width="220" height="30" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
  <text x="600" y="500" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Token 生成速率</text>
  
  <!-- Card 3: Cost -->
  <rect x="800" y="240" width="300" height="300" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="12"/>
  <circle cx="950" cy="300" r="40" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="950" y="310" font-size="32" text-anchor="middle">💰</text>
  <text x="950" y="370" font-family="-apple-system, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle" font-weight="700">成本监控</text>
  <text x="950" y="400" font-family="-apple-system, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Token 统计 + 预警</text>
  <rect x="840" y="440" width="220" height="30" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
  <text x="950" y="460" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">实时成本计算</text>
  <rect x="840" y="480" width="220" height="30" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
  <text x="950" y="500" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">多层级告警机制</text>
  
  <!-- Bottom Line -->
  <rect x="100" y="580" width="1000" height="2" fill="#cbd5e1" opacity="0.5"/>
  <text x="600" y="610" font-family="-apple-system, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">AI 技术演进与核心算法实战 | 第二十八篇</text>
</svg>
