<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 12; ry: 12; }
      .header { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .trace-row { fill: #f1f5f9; rx: 4; ry: 4; }
      .trace-bar { rx: 3; ry: 3; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; fill: #0f172a; text-anchor: start; dominant-baseline: middle; font-weight: 700; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #1e293b; text-anchor: start; dominant-baseline: middle; }
      .text-time { font-family: "Courier New", monospace; font-size: 11px; fill: #64748b; text-anchor: end; dominant-baseline: middle; }
      .text-duration { font-family: "Courier New", monospace; font-size: 10px; fill: #475569; text-anchor: start; dominant-baseline: middle; }
    </style>
  </defs>
  
  <!-- Background Card -->
  <rect x="20" y="20" width="710" height="360" class="bg"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="710" height="50" class="header" rx="12" ry="12"/>
  <text x="40" y="45" class="text-title">Trace ID: a1b2c3d4e5f6...</text>
  <text x="680" y="45" class="text-time">Total: 2.3s</text>
  
  <!-- Timeline Header -->
  <line x1="250" y1="80" x2="250" y2="360" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="80" x2="400" y2="360" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="550" y1="80" x2="550" y2="360" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  
  <text x="250" y="75" class="text-time" font-size="10">500ms</text>
  <text x="400" y="75" class="text-time" font-size="10">1.0s</text>
  <text x="550" y="75" class="text-time" font-size="10">1.5s</text>
  
  <!-- Span 1: Query Preprocessing -->
  <rect x="30" y="90" width="690" height="30" class="trace-row"/>
  <text x="40" y="105" class="text-label" font-weight="600">query_preprocessing</text>
  <rect x="250" y="95" width="30" height="20" class="trace-bar" fill="#94a3b8"/>
  <text x="290" y="105" class="text-duration">80ms</text>
  
  <!-- Span 2: Vector Search -->
  <rect x="30" y="125" width="690" height="30" class="trace-row"/>
  <text x="55" y="140" class="text-label">vector_search</text>
  <rect x="280" y="130" width="80" height="20" class="trace-bar" fill="#f59e0b"/>
  <text x="370" y="140" class="text-duration">250ms</text>
  
  <!-- Span 3: Re-ranking -->
  <rect x="30" y="160" width="690" height="30" class="trace-row"/>
  <text x="55" y="175" class="text-label">reranking</text>
  <rect x="360" y="165" width="45" height="20" class="trace-bar" fill="#f59e0b"/>
  <text x="415" y="175" class="text-duration">120ms</text>
  
  <!-- Span 4: Prompt Assembly -->
  <rect x="30" y="195" width="690" height="30" class="trace-row"/>
  <text x="55" y="210" class="text-label">prompt_assembly</text>
  <rect x="405" y="200" width="20" height="20" class="trace-bar" fill="#94a3b8"/>
  <text x="435" y="210" class="text-duration">50ms</text>
  
  <!-- Span 5: LLM Generation -->
  <rect x="30" y="230" width="690" height="30" class="trace-row"/>
  <text x="55" y="245" class="text-label" font-weight="600">llm_completion (gpt-4-turbo)</text>
  <rect x="425" y="235" width="180" height="20" class="trace-bar" fill="#3b82f6"/>
  <text x="615" y="245" class="text-duration">1600ms</text>
  
  <!-- Sub-span: TTFT -->
  <rect x="30" y="265" width="690" height="25" class="trace-row" opacity="0.7"/>
  <text x="70" y="278" class="text-label" font-size="11">└─ time_to_first_token</text>
  <rect x="425" y="270" width="40" height="15" class="trace-bar" fill="#60a5fa"/>
  <text x="475" y="278" class="text-duration" font-size="9">350ms</text>
  
  <!-- Sub-span: Generation -->
  <rect x="30" y="293" width="690" height="25" class="trace-row" opacity="0.7"/>
  <text x="70" y="306" class="text-label" font-size="11">└─ token_generation</text>
  <rect x="465" y="298" width="140" height="15" class="trace-bar" fill="#60a5fa"/>
  <text x="615" y="306" class="text-duration" font-size="9">1250ms (45 tok/s)</text>
  
  <!-- Span 6: Post-processing -->
  <rect x="30" y="325" width="690" height="30" class="trace-row"/>
  <text x="55" y="340" class="text-label">post_processing</text>
  <rect x="605" y="330" width="20" height="20" class="trace-bar" fill="#94a3b8"/>
  <text x="635" y="340" class="text-duration">50ms</text>
  
  <!-- Status indicators -->
  <circle cx="700" cy="105" r="6" fill="#22c55e"/>
  <circle cx="700" cy="140" r="6" fill="#22c55e"/>
  <circle cx="700" cy="175" r="6" fill="#22c55e"/>
  <circle cx="700" cy="210" r="6" fill="#22c55e"/>
  <circle cx="700" cy="245" r="6" fill="#22c55e"/>
  <circle cx="700" cy="340" r="6" fill="#22c55e"/>
  
  <text x="30" y="375" class="text-label" font-size="10" fill="#64748b">✓ 所有 Span 状态正常 | 绿色 = 成功, 黄色 = 警告, 红色 = 错误</text>
</svg>
