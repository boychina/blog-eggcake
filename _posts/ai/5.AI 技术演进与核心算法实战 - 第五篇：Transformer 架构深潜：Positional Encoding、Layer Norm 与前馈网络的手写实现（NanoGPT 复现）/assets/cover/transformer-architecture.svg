<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0f172a" />
<stop offset="100%" stop-color="#1e293b" />
</linearGradient>
<linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
<stop offset="100%" stop-color="#1e293b" stop-opacity="0.8"/>
</linearGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="4" result="coloredBlur"/>
<feMerge>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)" />
<rect x="100" y="100" width="1000" height="430" rx="24" fill="url(#cardBg)" stroke="#475569" stroke-width="2" />
<circle cx="200" cy="200" r="40" fill="#3b82f6" opacity="0.2" />
<circle cx="1000" cy="430" r="80" fill="#8b5cf6" opacity="0.2" />
<text x="600" y="240" font-family="-apple-system, sans-serif" font-size="64" font-weight="bold" fill="#f8fafc" text-anchor="middle" filter="url(#glow)">Transformer 架构深潜</text>
<text x="600" y="320" font-family="-apple-system, sans-serif" font-size="36" font-weight="500" fill="#94a3b8" text-anchor="middle">Positional Encoding、Layer Norm 与前馈网络的手写实现</text>
<text x="600" y="400" font-family="-apple-system, sans-serif" font-size="28" fill="#38bdf8" text-anchor="middle">NanoGPT 复现与源码级解析</text>
<g transform="translate(480, 480)">
<rect x="0" y="0" width="240" height="40" rx="20" fill="#3b82f6" opacity="0.2" />
<text x="120" y="26" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#60a5fa" text-anchor="middle">AI 核心算法实战系列 05</text>
</g>
</svg>