<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Title text -->
  <text x="600" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">自主规划算法</text>
  <text x="600" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#e0e7ff" text-anchor="middle">Plan-and-Solve · Reflexion · MCTS</text>
  
  <!-- Central diagram: Three planning approaches -->
  <g transform="translate(150, 240)">
    <!-- Plan-and-Solve Box -->
    <rect x="0" y="0" width="260" height="280" rx="12" fill="white" opacity="0.95" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="50" rx="12" fill="#3b82f6"/>
    <rect x="0" y="30" width="260" height="20" fill="#3b82f6"/>
    <text x="130" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Plan-and-Solve</text>
    
    <!-- Planning phase -->
    <rect x="20" y="70" width="220" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="130" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="bold">阶段 1: Planning</text>
    <text x="130" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">分解任务 → 生成步骤序列</text>
    <text x="130" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">📋 制定完整计划</text>
    
    <!-- Arrow -->
    <line x1="130" y1="155" x2="130" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Execution phase -->
    <rect x="20" y="180" width="220" height="80" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="130" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#166534" text-anchor="middle" font-weight="bold">阶段 2: Solving</text>
    <text x="130" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534" text-anchor="middle">逐步执行 → 收集结果</text>
    <text x="130" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534" text-anchor="middle">⚡ 按部就班行动</text>
  </g>
  
  <g transform="translate(470, 240)">
    <!-- Reflexion Box -->
    <rect x="0" y="0" width="260" height="280" rx="12" fill="white" opacity="0.95" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="50" rx="12" fill="#8b5cf6"/>
    <rect x="0" y="30" width="260" height="20" fill="#8b5cf6"/>
    <text x="130" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Reflexion</text>
    
    <!-- Trial loop -->
    <circle cx="130" cy="140" r="90" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="8 4"/>
    
    <text x="130" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle" font-weight="bold">Trial N</text>
    <text x="130" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle">执行任务</text>
    
    <text x="130" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle" font-weight="bold">反思</text>
    <text x="130" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle">分析失败原因</text>
    
    <text x="130" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5b21b6" text-anchor="middle" font-weight="bold">改进策略</text>
    <text x="130" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle">🔄 迭代优化</text>
    
    <!-- Circular arrow indicators -->
    <path d="M 210 140 A 90 90 0 0 1 130 55" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <g transform="translate(790, 240)">
    <!-- MCTS Box -->
    <rect x="0" y="0" width="260" height="280" rx="12" fill="white" opacity="0.95" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="50" rx="12" fill="#f59e0b"/>
    <rect x="0" y="30" width="260" height="20" fill="#f59e0b"/>
    <text x="130" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">LLM + MCTS</text>
    
    <!-- Tree structure -->
    <circle cx="130" cy="90" r="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <text x="130" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">根</text>
    
    <line x1="130" y1="102" x2="80" y2="140" stroke="#f59e0b" stroke-width="2"/>
    <line x1="130" y1="102" x2="130" y2="140" stroke="#f59e0b" stroke-width="2"/>
    <line x1="130" y1="102" x2="180" y2="140" stroke="#f59e0b" stroke-width="2"/>
    
    <circle cx="80" cy="145" r="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="130" cy="145" r="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="180" cy="145" r="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    
    <line x1="80" y1="155" x2="60" y2="190" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="80" y1="155" x2="100" y2="190" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="130" y1="155" x2="120" y2="190" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="130" y1="155" x2="140" y2="190" stroke="#f59e0b" stroke-width="1.5"/>
    
    <circle cx="60" cy="195" r="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="100" cy="195" r="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="120" cy="195" r="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="140" cy="195" r="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    
    <text x="130" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#92400e" text-anchor="middle">🌳 多路径探索</text>
    <text x="130" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#92400e" text-anchor="middle">✂️ 启发式剪枝</text>
  </g>
  
  <!-- Bottom tagline -->
  <rect x="100" y="550" width="1000" height="50" rx="8" fill="white" opacity="0.9"/>
  <text x="600" y="582" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#4c1d95" text-anchor="middle">从"边想边做"到"先谋后动"的智能跃迁</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="40" fill="white" opacity="0.1"/>
  <circle cx="1100" cy="530" r="60" fill="white" opacity="0.1"/>
  <circle cx="200" cy="550" r="30" fill="white" opacity="0.08"/>
</svg>
