<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="max-width: 800px; margin: 20px 0;" shape-rendering="crispEdges" text-rendering="geometricPrecision">
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .box { fill: #f8fafc; stroke: #3b82f6; stroke-width: 2; rx: 8; ry: 8; }
      .guardrail-box { fill: #fef08a; stroke: #ca8a04; stroke-width: 3; rx: 12; ry: 12; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; font-weight: 700; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; fill: #1e293b; text-anchor: middle; dominant-baseline: middle; font-weight: 600; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; fill: #64748b; text-anchor: start; dominant-baseline: middle; }
      .arrow { stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrowhead); fill: none; }
      .red-arrow { stroke: #ef4444; stroke-width: 2.5; marker-end: url(#arrowhead-red); fill: none; stroke-dasharray: 6,4; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrowhead-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" class="bg"/>
  
  <!-- Title -->
  <text x="400" y="35" class="text-title">Guardrails 多层安全防护架构</text>
  
  <!-- Input Layer -->
  <rect x="50" y="60" width="150" height="70" class="box"/>
  <text x="125" y="85" class="text-label">用户输入</text>
  <text x="60" y="110" class="text-desc">• 原始查询</text>
  <text x="60" y="125" class="text-desc">• 上下文信息</text>
  
  <!-- Arrow to Pre-processing -->
  <path d="M 200 95 L 240 95" class="arrow"/>
  
  <!-- Pre-processing Guardrails -->
  <rect x="240" y="60" width="180" height="110" class="guardrail-box"/>
  <text x="330" y="85" class="text-label" font-size="16">前置护栏</text>
  <text x="255" y="110" class="text-desc">✓ 提示词注入检测</text>
  <text x="255" y="130" class="text-desc">✓ PII 数据识别与脱敏</text>
  <text x="255" y="150" class="text-desc">✓ 恶意意图分类</text>
  
  <!-- Arrow to LLM -->
  <path d="M 420 115 L 460 115" class="arrow"/>
  <text x="440" y="105" class="text-desc" font-size="11">安全输入</text>
  
  <!-- LLM Processing -->
  <rect x="460" y="75" width="140" height="80" class="box" fill="#dbeafe"/>
  <text x="530" y="100" class="text-label">LLM 推理</text>
  <text x="475" y="125" class="text-desc">• 生成响应内容</text>
  <text x="475" y="143" class="text-desc">• 工具调用决策</text>
  
  <!-- Arrow to Post-processing -->
  <path d="M 600 115 L 640 115" class="arrow"/>
  <text x="620" y="105" class="text-desc" font-size="11">原始输出</text>
  
  <!-- Post-processing Guardrails -->
  <rect x="640" y="60" width="130" height="110" class="guardrail-box"/>
  <text x="705" y="85" class="text-label" font-size="16">后置护栏</text>
  <text x="655" y="110" class="text-desc">✓ 毒性内容过滤</text>
  <text x="655" y="130" class="text-desc">✓ 事实性核查</text>
  <text x="655" y="150" class="text-desc">✓ 格式验证</text>
  
  <!-- Arrow down to Output -->
  <path d="M 705 170 L 705 210" class="arrow"/>
  <text x="715" y="195" class="text-desc" font-size="11">审核通过</text>
  
  <!-- Final Output -->
  <rect x="630" y="210" width="150" height="60" class="box" fill="#bbf7d0"/>
  <text x="705" y="235" class="text-label">安全输出</text>
  <text x="645" y="258" class="text-desc">返回给用户</text>
  
  <!-- Rejection Path -->
  <path d="M 330 170 L 330 250 L 530 250 L 530 210" class="red-arrow"/>
  <text x="430" y="265" class="text-desc" font-size="11" fill="#ef4444">检测到威胁 → 拦截并返回安全提示</text>
  
  <!-- Rejection Response Box -->
  <rect x="470" y="280" width="200" height="70" class="box" fill="#fecdd3"/>
  <text x="570" y="305" class="text-label" fill="#be123c">安全拦截响应</text>
  <text x="485" y="328" class="text-desc" fill="#be123c">"抱歉，我无法处理该请求"</text>
  
  <!-- Feedback Loop -->
  <path d="M 705 270 Q 705 320 650 320 L 350 320 Q 300 320 300 280 L 300 170" class="arrow" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8,4" fill="none"/>
  <text x="500" y="335" class="text-desc" font-size="11" fill="#3b82f6">日志记录与监控反馈</text>
  
  <!-- Bottom Legend -->
  <rect x="50" y="370" width="700" height="110" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <text x="400" y="395" class="text-label" font-size="16">关键防护机制说明</text>
  
  <text x="70" y="420" class="text-desc" font-size="12">🛡️ 提示词注入防御：</text>
  <text x="70" y="438" class="text-desc" font-size="11">使用分隔符、意图识别、对抗样本检测防止 Prompt Injection 攻击</text>
  
  <text x="70" y="458" class="text-desc" font-size="12">🔒 PII 脱敏保护：</text>
  <text x="70" y="476" class="text-desc" font-size="11">正则表达式 + NER 模型识别并替换敏感信息（手机号、身份证、邮箱等）</text>
  
  <text x="420" y="420" class="text-desc" font-size="12">✅ 内容过滤算法：</text>
  <text x="420" y="438" class="text-desc" font-size="11">毒性分类器、关键词黑名单、语义相似度检测确保输出安全合规</text>
  
  <text x="420" y="458" class="text-desc" font-size="12">📊 监控与审计：</text>
  <text x="420" y="476" class="text-desc" font-size="11">全链路日志记录、异常模式检测、自动化告警机制</text>
</svg>
