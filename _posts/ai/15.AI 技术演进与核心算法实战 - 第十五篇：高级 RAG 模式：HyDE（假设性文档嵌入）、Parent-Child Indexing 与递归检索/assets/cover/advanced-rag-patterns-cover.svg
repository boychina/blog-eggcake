<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 42px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; fill: #e0e7ff; }
      .highlight { fill: #fbbf24; }
      .pattern-box { fill: #ffffff; stroke: #fbbf24; stroke-width: 2; rx: 8; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <text x="600" y="70" text-anchor="middle" class="title">高级 RAG 模式</text>
  <text x="600" y="115" text-anchor="middle" class="subtitle">HyDE · Parent-Child Indexing · Recursive Retrieval</text>
  
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="300" height="130" class="pattern-box"/>
    <text x="150" y="35" text-anchor="middle" style="font-size: 18px; fill:#7c3aed; font-weight:bold;">🎯 HyDE</text>
    <text x="150" y="65" text-anchor="middle" style="font-size: 14px; fill:#475569;">假设性文档嵌入</text>
    <text x="150" y="95" text-anchor="middle" style="font-size: 13px; fill:#475569;">用 AI 生成假设答案</text>
    <text x="150" y="115" text-anchor="middle" style="font-size: 13px; fill:#475569;">检索真实文档</text>
  </g>
  
  <g transform="translate(450, 180)">
    <rect x="0" y="0" width="300" height="130" class="pattern-box"/>
    <text x="150" y="35" text-anchor="middle" style="font-size: 18px; fill:#2563eb; font-weight:bold;">📊 Parent-Child</text>
    <text x="150" y="65" text-anchor="middle" style="font-size: 14px; fill:#475569;">层级索引结构</text>
    <text x="150" y="95" text-anchor="middle" style="font-size: 13px; fill:#475569;">保留文档层级关系</text>
    <text x="150" y="115" text-anchor="middle" style="font-size: 13px; fill:#475569;">可追溯父文档上下文</text>
  </g>
  
  <g transform="translate(800, 180)">
    <rect x="0" y="0" width="300" height="130" class="pattern-box"/>
    <text x="150" y="35" text-anchor="middle" style="font-size: 18px; fill:#db2777; font-weight:bold;">🔄 Recursive</text>
    <text x="150" y="65" text-anchor="middle" style="font-size: 14px; fill:#475569;">递归检索</text>
    <text x="150" y="95" text-anchor="middle" style="font-size: 13px; fill:#475569;">像剥洋葱一样</text>
    <text x="150" y="115" text-anchor="middle" style="font-size: 13px; fill:#475569;">层层深入检索</text>
  </g>
  
  <g transform="translate(200, 360)">
    <rect x="0" y="0" width="800" height="180" fill="#ffffff" fill-opacity="0.15" stroke="#fbbf24" stroke-width="2" rx="12"/>
    <text x="400" y="35" text-anchor="middle" class="subtitle" style="font-size: 22px; fill:#fbbf24; font-weight:bold;">解决传统 RAG 的三大痛点</text>
    
    <g transform="translate(40, 70)">
      <rect x="0" y="0" width="220" height="90" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="6"/>
      <text x="110" y="30" text-anchor="middle" style="font-size: 14px; fill:#991b1b; font-weight:bold;">❌ 模糊查询无法理解</text>
      <text x="110" y="55" text-anchor="middle" style="font-size: 12px; fill:#991b1b;">用户表达不准确</text>
      <text x="110" y="75" text-anchor="middle" style="font-size: 12px; fill:#991b1b;">检索结果泛化</text>
      
      <rect x="260" y="0" width="220" height="90" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="6"/>
      <text x="370" y="30" text-anchor="middle" style="font-size: 14px; fill:#166534; font-weight:bold;">✅ HyDE 假设答案</text>
      <text x="370" y="55" text-anchor="middle" style="font-size: 12px; fill:#166534;">LLM 生成假设性答案</text>
      <text x="370" y="75" text-anchor="middle" style="font-size: 12px; fill:#166534;">语义对齐真实文档</text>
      
      <rect x="520" y="0" width="220" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
      <text x="630" y="30" text-anchor="middle" style="font-size: 14px; fill:#92400e; font-weight:bold;">💡 效果提升</text>
      <text x="630" y="55" text-anchor="middle" style="font-size: 12px; fill:#92400e;">Recall@10 +40-60%</text>
      <text x="630" y="75" text-anchor="middle" style="font-size: 12px; fill:#92400e;">模糊查询克星</text>
    </g>
  </g>
  
  <text x="600" y="590" text-anchor="middle" class="subtitle" style="font-size: 18px; fill: #fbbf24;">AI 技术演进与核心算法实战 | 第十五篇</text>
</svg>
