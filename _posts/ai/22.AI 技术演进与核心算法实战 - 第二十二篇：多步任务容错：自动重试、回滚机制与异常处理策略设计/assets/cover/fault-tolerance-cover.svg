<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee2e2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="retryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="checkpointGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Title Section -->
  <text x="600" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="bold" fill="#0f172a" text-anchor="middle">Fault Tolerance</text>
  <text x="600" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#64748b" text-anchor="middle">Retry, Rollback &amp; Error Handling</text>
  
  <!-- Main Diagram: Fault Tolerance Flow -->
  <g filter="url(#shadow)">
    <!-- Task Steps -->
    <rect x="80" y="280" width="120" height="70" rx="10" fill="url(#checkpointGrad)" stroke="#10b981" stroke-width="3"/>
    <text x="140" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">Step 1</text>
    <text x="140" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">Success</text>
    
    <rect x="240" y="280" width="120" height="70" rx="10" fill="url(#checkpointGrad)" stroke="#10b981" stroke-width="3"/>
    <text x="300" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">Step 2</text>
    <text x="300" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">Success</text>
    
    <!-- Failed Step with Retry -->
    <rect x="400" y="280" width="120" height="70" rx="10" fill="url(#retryGrad)" stroke="#f59e0b" stroke-width="3"/>
    <text x="460" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Step 3</text>
    <text x="460" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">Retry 2/3</text>
    
    <!-- Checkpoint Icon -->
    <circle cx="460" cy="250" r="25" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="460" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">CP</text>
    
    <rect x="560" y="280" width="120" height="70" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="620" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">Step 4</text>
    <text x="620" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">Failed</text>
    
    <!-- Recovery Path -->
    <path d="M 620 350 Q 620 420 460 420 Q 300 420 300 350" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowGreen)"/>
    <text x="460" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#059669" text-anchor="middle">Rollback to Checkpoint</text>
    
    <!-- Shield Protection -->
    <g transform="translate(900, 280)">
      <path d="M 60 0 L 120 20 L 120 70 Q 120 110 60 130 Q 0 110 0 70 L 0 20 Z" 
            fill="url(#shieldGrad)" stroke="#ef4444" stroke-width="3"/>
      <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">Shield</text>
      <text x="60" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#ef4444" text-anchor="middle">Protection</text>
      <!-- Shield icon using path instead of emoji -->
      <path d="M 45 85 L 60 80 L 75 85 L 75 95 Q 75 105 60 110 Q 45 105 45 95 Z" fill="#ef4444" opacity="0.6"/>
    </g>
    
    <!-- Connecting Arrows -->
    <line x1="200" y1="315" x2="235" y2="315" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <line x1="360" y1="315" x2="395" y2="315" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <line x1="520" y1="315" x2="555" y2="315" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowRed)"/>
  </g>
  
  <!-- Key Features Boxes -->
  <g>
    <!-- Feature 1: Retry -->
    <rect x="150" y="500" width="220" height="90" rx="8" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <text x="260" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#b45309" text-anchor="middle">Smart Retry</text>
    <text x="260" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Exponential Backoff</text>
    <text x="260" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">+ Jitter + Circuit Breaker</text>
    
    <!-- Feature 2: Checkpoint -->
    <rect x="490" y="500" width="220" height="90" rx="8" fill="white" stroke="#10b981" stroke-width="2"/>
    <text x="600" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#047857" text-anchor="middle">State Management</text>
    <text x="600" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Checkpoint &amp; Recovery</text>
    <text x="600" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Checkpoint + Compensation</text>
    
    <!-- Feature 3: Fallback -->
    <rect x="830" y="500" width="220" height="90" rx="8" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <text x="940" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#6d28d9" text-anchor="middle">Fallback Strategy</text>
    <text x="940" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Graceful Degradation</text>
    <text x="940" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Multi-level + Human Fallback</text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="150" r="40" fill="#fecaca" opacity="0.3"/>
  <circle cx="1100" cy="180" r="50" fill="#fed7aa" opacity="0.3"/>
  <circle cx="200" cy="450" r="30" fill="#bbf7d0" opacity="0.3"/>
</svg>
