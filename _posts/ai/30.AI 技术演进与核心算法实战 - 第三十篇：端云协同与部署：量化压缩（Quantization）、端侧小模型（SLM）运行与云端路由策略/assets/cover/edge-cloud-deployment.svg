<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" shape-rendering="crispEdges" text-rendering="geometricPrecision">
  <defs>
    <style>
      .bg { fill: url(#gradient); }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 16; ry: 16; filter: url(#shadow); }
      .tech-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; ry: 8; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 48px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; font-weight: 800; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 26px; fill: #475569; text-anchor: middle; dominant-baseline: middle; font-weight: 600; }
      .text-tech { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 20px; fill: #1e293b; text-anchor: middle; dominant-baseline: middle; font-weight: 600; }
      .text-detail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #64748b; text-anchor: middle; dominant-baseline: middle; }
      .icon-bg { fill: #dbeafe; }
      .icon { fill: #3b82f6; }
      .cloud-icon { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2; }
      .edge-icon { fill: #bbf7d0; stroke: #16a34a; stroke-width: 2; }
      .quant-icon { fill: #fef08a; stroke: #ca8a04; stroke-width: 2; }
      .arrow { stroke: #94a3b8; stroke-width: 2.5; marker-end: url(#arrowhead); fill: none; }
    </style>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>
  
  <!-- Main Title Card -->
  <rect x="100" y="60" width="1000" height="140" class="card"/>
  <text x="600" y="115" class="text-title">端云协同与部署</text>
  <text x="600" y="165" class="text-subtitle">量化压缩 · 端侧小模型运行 · 云端路由策略</text>
  
  <!-- Cloud Computing Section (Top Left) -->
  <rect x="100" y="240" width="320" height="160" class="card"/>
  <circle cx="260" cy="290" r="35" class="cloud-icon"/>
  <text x="260" y="290" font-size="28" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-weight="bold">☁️</text>
  <text x="260" y="340" class="text-tech">云端大模型</text>
  <text x="260" y="365" class="text-detail">GPT-4 / Claude / Gemini</text>
  <text x="260" y="385" class="text-detail">高精度 · 高成本 · 低延迟</text>
  
  <!-- Edge Computing Section (Top Right) -->
  <rect x="780" y="240" width="320" height="160" class="card"/>
  <circle cx="940" cy="290" r="35" class="edge-icon"/>
  <text x="940" y="290" font-size="28" fill="#16a34a" text-anchor="middle" dominant-baseline="middle" font-weight="bold">📱</text>
  <text x="940" y="340" class="text-tech">端侧小模型</text>
  <text x="940" y="365" class="text-detail">Llama 3.2 / Phi-3 / Qwen</text>
  <text x="940" y="385" class="text-detail">隐私保护 · 低成本 · 离线可用</text>
  
  <!-- Quantization Section (Bottom Center) -->
  <rect x="350" y="440" width="500" height="150" class="card"/>
  <circle cx="600" cy="490" r="35" class="quant-icon"/>
  <text x="600" y="490" font-size="28" fill="#ca8a04" text-anchor="middle" dominant-baseline="middle" font-weight="bold">⚙️</text>
  <text x="600" y="540" class="text-tech">量化压缩技术</text>
  <text x="600" y="565" class="text-detail">INT8 / INT4 / FP16 · 模型蒸馏 · 剪枝优化</text>
  
  <!-- Arrows showing collaboration -->
  <path d="M 420 320 L 550 320" class="arrow"/>
  <path d="M 650 320 L 780 320" class="arrow"/>
  <path d="M 600 400 L 600 440" class="arrow"/>
  
  <!-- Routing Strategy Label -->
  <rect x="450" y="305" width="300" height="30" class="tech-card" fill="#fef08a"/>
  <text x="600" y="325" class="text-detail" font-weight="600" fill="#a16207">智能路由策略 · 负载均衡</text>
</svg>
