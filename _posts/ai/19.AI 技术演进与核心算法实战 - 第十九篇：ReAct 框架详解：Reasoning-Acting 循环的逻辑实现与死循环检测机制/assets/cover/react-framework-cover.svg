<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="thoughtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.25" />
    </linearGradient>
    <linearGradient id="actionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.25" />
    </linearGradient>
    <linearGradient id="observeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.25" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Title Section -->
  <text x="600" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="bold" fill="#0f172a" text-anchor="middle">ReAct Framework</text>
  <text x="600" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#64748b" text-anchor="middle">Reasoning + Acting 循环与死循环检测</text>
  
  <!-- Main Cycle Diagram -->
  <g filter="url(#shadow)">
    <!-- Thought Box (Top) -->
    <rect x="480" y="170" width="240" height="100" rx="16" fill="url(#thoughtGrad)" stroke="#3b82f6" stroke-width="3"/>
    <text x="600" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#1e40af" text-anchor="middle">Thought</text>
    <text x="600" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#3b82f6" text-anchor="middle">思考 · 分析 · 决策</text>
    
    <!-- Action Box (Bottom Right) -->
    <rect x="820" y="350" width="240" height="100" rx="16" fill="url(#actionGrad)" stroke="#10b981" stroke-width="3"/>
    <text x="940" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#065f46" text-anchor="middle">Action</text>
    <text x="940" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#10b981" text-anchor="middle">行动 · 调用工具</text>
    
    <!-- Observation Box (Bottom Left) -->
    <rect x="140" y="350" width="240" height="100" rx="16" fill="url(#observeGrad)" stroke="#f59e0b" stroke-width="3"/>
    <text x="260" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#92400e" text-anchor="middle">Observation</text>
    <text x="260" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#f59e0b" text-anchor="middle">观察 · 获取结果</text>
  </g>
  
  <!-- Cycle Arrows -->
  <!-- Thought -> Action -->
  <path d="M 720 220 Q 780 220 840 280 Q 880 320 880 350" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="820" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#3b82f6" text-anchor="middle">1</text>
  
  <!-- Action -> Observation -->
  <path d="M 820 400 Q 600 480 380 400" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="600" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">2</text>
  
  <!-- Observation -> Thought -->
  <path d="M 260 350 Q 260 280 400 240 Q 440 220 480 220" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="360" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle">3</text>
  
  <!-- Dead Loop Detection Section -->
  <g filter="url(#shadow)">
    <rect x="350" y="510" width="500" height="90" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="600" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#dc2626" text-anchor="middle">⚠️ 死循环检测机制 (Loop Detection)</text>
    <text x="600" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">监控重复动作 · 限制最大迭代次数 · 防止无限循环</text>
  </g>
  
  <!-- Code Snippet Decoration -->
  <g transform="translate(80, 180)">
    <rect width="180" height="120" rx="8" fill="#1e293b" opacity="0.9"/>
    <text x="90" y="30" font-family="monospace" font-size="14" fill="#38bdf8" text-anchor="middle">def detect_loop():</text>
    <text x="90" y="55" font-family="monospace" font-size="13" fill="#a5f3fc" text-anchor="middle">  recent = history[-3:]</text>
    <text x="90" y="80" font-family="monospace" font-size="13" fill="#a5f3fc" text-anchor="middle">  if all_same(recent):</text>
    <text x="90" y="105" font-family="monospace" font-size="13" fill="#fca5a5" text-anchor="middle">    raise LoopError()</text>
  </g>

</svg>
