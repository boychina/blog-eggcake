<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="cot-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="tot-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="33%" style="stop-color:#c084fc"/>
      <stop offset="66%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <!-- Background grid -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(100,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(200,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(300,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(400,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(500,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(600,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(700,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(800,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(900,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(1000,0)"/>
    <line x1="0" y1="0" x2="0" y2="630" transform="translate(1100,0)"/>
    <line x1="0" y1="0" x2="1200" y2="0" transform="translate(0,100)"/>
    <line x1="0" y1="0" x2="1200" y2="0" transform="translate(0,200)"/>
    <line x1="0" y1="0" x2="1200" y2="0" transform="translate(0,300)"/>
    <line x1="0" y1="0" x2="1200" y2="0" transform="translate(0,400)"/>
    <line x1="0" y1="0" x2="1200" y2="0" transform="translate(0,500)"/>
    <line x1="0" y1="0" x2="1200" y2="0" transform="translate(0,600)"/>
  </g>
  <!-- Series badge -->
  <rect x="60" y="40" width="240" height="32" rx="16" fill="#334155" fill-opacity="0.5"/>
  <text x="70" y="60" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" font-weight="500">AI 技术演进与核心算法实战</text>
  <!-- Main title -->
  <text x="600" y="160" text-anchor="middle" fill="url(#title-grad)" font-family="Arial, sans-serif" font-size="42" font-weight="bold" filter="url(#glow)">高级推理策略</text>
  <text x="600" y="200" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" letter-spacing="2">Chain-of-Thought · Tree-of-Thoughts</text>
  <text x="600" y="230" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="14">算法原理与实现</text>
  <!-- CoT Card -->
  <g transform="translate(80, 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="280" rx="20" fill="url(#card-bg)" stroke="url(#cot-grad)" stroke-width="1.5"/>
    <text x="160" y="35" text-anchor="middle" fill="url(#cot-grad)" font-family="Arial, sans-serif" font-size="18" font-weight="bold">CoT 思维链</text>
    <text x="160" y="55" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Chain-of-Thought</text>
    <!-- Chain visualization -->
    <g transform="translate(40, 80)">
      <rect x="0" y="20" width="80" height="50" rx="8" fill="url(#cot-grad)" opacity="0.8"/>
      <text x="40" y="50" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 1</text>
      <line x1="80" y1="45" x2="100" y2="45" stroke="#fff" stroke-width="2"/>
      <polygon points="96,41 96,49 106,45" fill="#fff"/>
      <rect x="100" y="20" width="80" height="50" rx="8" fill="url(#cot-grad)" opacity="0.8"/>
      <text x="140" y="50" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 2</text>
      <line x1="180" y1="45" x2="200" y2="45" stroke="#fff" stroke-width="2"/>
      <polygon points="196,41 196,49 206,45" fill="#fff"/>
      <rect x="200" y="20" width="80" height="50" rx="8" fill="url(#cot-grad)" opacity="0.8"/>
      <text x="240" y="50" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 3</text>
    </g>
    <text x="160" y="210" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">线性推理路径</text>
    <text x="160" y="235" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">"让我们一步一步来想"</text>
    <text x="160" y="255" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="10">Zero-shot / Few-shot CoT</text>
  </g>
  <!-- ToT Card -->
  <g transform="translate(440, 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="280" rx="20" fill="url(#card-bg)" stroke="url(#tot-grad)" stroke-width="1.5"/>
    <text x="160" y="35" text-anchor="middle" fill="url(#tot-grad)" font-family="Arial, sans-serif" font-size="18" font-weight="bold">ToT 思维树</text>
    <text x="160" y="55" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Tree-of-Thoughts</text>
    <!-- Tree visualization -->
    <g transform="translate(160, 70)">
      <circle cx="0" cy="0" r="18" fill="url(#tot-grad)"/>
      <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Q</text>
      <!-- Branch 1 -->
      <line x1="-12" y1="12" x2="-50" y2="45" stroke="url(#tot-grad)" stroke-width="1.5" opacity="0.7"/>
      <circle cx="-55" cy="50" r="14" fill="url(#tot-grad)" opacity="0.7"/>
      <text x="-55" y="55" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="8">A1</text>
      <line x1="-62" y1="58" x2="-75" y2="80" stroke="url(#tot-grad)" stroke-width="1" opacity="0.5"/>
      <circle cx="-80" cy="85" r="10" fill="url(#tot-grad)" opacity="0.5"/>
      <text x="-80" y="89" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="7">B1</text>
      <line x1="-48" y1="58" x2="-35" y2="80" stroke="url(#tot-grad)" stroke-width="1" opacity="0.5"/>
      <circle cx="-30" cy="85" r="10" fill="url(#tot-grad)" opacity="0.5"/>
      <text x="-30" y="89" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="7">B2</text>
      <!-- Branch 2 -->
      <line x1="0" y1="18" x2="0" y2="45" stroke="url(#tot-grad)" stroke-width="1.5" opacity="0.7"/>
      <circle cx="0" cy="50" r="14" fill="url(#tot-grad)" opacity="0.7"/>
      <text x="0" y="55" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="8">A2</text>
      <line x1="-8" y1="58" x2="-20" y2="80" stroke="url(#tot-grad)" stroke-width="1" opacity="0.5"/>
      <circle cx="-25" cy="85" r="10" fill="url(#tot-grad)" opacity="0.5"/>
      <text x="-25" y="89" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="7">B3</text>
      <!-- Branch 3 -->
      <line x1="12" y1="12" x2="50" y2="45" stroke="url(#tot-grad)" stroke-width="1.5" opacity="0.7"/>
      <circle cx="55" cy="50" r="14" fill="url(#tot-grad)" opacity="0.7"/>
      <text x="55" y="55" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="8">A3</text>
      <line x1="48" y1="58" x2="35" y2="80" stroke="url(#tot-grad)" stroke-width="1" opacity="0.5"/>
      <circle cx="30" cy="85" r="10" fill="url(#tot-grad)" opacity="0.5"/>
      <text x="30" y="89" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="7">B4</text>
      <line x1="62" y1="58" x2="75" y2="80" stroke="url(#tot-grad)" stroke-width="1" opacity="0.5"/>
      <circle cx="80" cy="85" r="10" fill="url(#tot-grad)" opacity="0.5"/>
      <text x="80" y="89" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="7">B5</text>
    </g>
    <text x="160" y="210" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">树状搜索 + 评估回溯</text>
    <text x="160" y="235" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="11">BFS / DFS 探索</text>
    <text x="160" y="255" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="10">选择最优推理路径</text>
  </g>
  <!-- VS symbol -->
  <g transform="translate(790, 390)">
    <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" font-weight="bold">VS</text>
  </g>
  <!-- Bottom text -->
  <text x="600" y="600" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="12" letter-spacing="3">从线性到树状 · 解锁大模型的高阶推理能力</text>
</svg>