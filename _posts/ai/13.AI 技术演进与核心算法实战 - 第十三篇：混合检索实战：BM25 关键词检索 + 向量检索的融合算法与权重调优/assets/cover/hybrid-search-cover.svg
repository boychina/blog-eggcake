<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 48px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; fill: #e0e7ff; }
      .highlight { fill: #fbbf24; }
      .bm25-box { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; rx: 6; }
      .vector-box { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; rx: 6; }
      .fusion-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2.5; rx: 8; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .score-text { font-family: monospace; font-size: 14px; fill: #1e40af; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <text x="600" y="80" text-anchor="middle" class="title">混合检索实战</text>
  <text x="600" y="130" text-anchor="middle" class="subtitle">BM25 + 向量检索的融合算法与权重调优</text>
  
  <g transform="translate(100, 200)">
    <text x="150" y="-30" text-anchor="middle" class="subtitle" style="font-size: 20px; fill:#93c5fd;">BM25 关键词检索</text>
    <rect x="50" y="0" width="200" height="150" class="bm25-box"/>
    <text x="150" y="35" text-anchor="middle" style="font-size: 14px; fill:#1e40af; font-weight:bold;">精确匹配</text>
    <text x="150" y="60" text-anchor="middle" style="font-size: 13px; fill:#1e40af;">• 词频统计 (TF)</text>
    <text x="150" y="85" text-anchor="middle" style="font-size: 13px; fill:#1e40af;">• 逆文档频率 (IDF)</text>
    <text x="150" y="110" text-anchor="middle" style="font-size: 13px; fill:#1e40af;">• 字段长度归一化</text>
    <text x="150" y="140" text-anchor="middle" class="score-text">Score: 0.85</text>
  </g>
  
  <g transform="translate(550, 200)">
    <text x="150" y="-30" text-anchor="middle" class="subtitle" style="font-size: 20px; fill:#86efac;">向量语义检索</text>
    <rect x="50" y="0" width="200" height="150" class="vector-box"/>
    <text x="150" y="35" text-anchor="middle" style="font-size: 14px; fill:#166534; font-weight:bold;">语义相似度</text>
    <text x="150" y="60" text-anchor="middle" style="font-size: 13px; fill:#166534;">• Embedding 编码</text>
    <text x="150" y="85" text-anchor="middle" style="font-size: 13px; fill:#166534;">• 余弦相似度</text>
    <text x="150" y="110" text-anchor="middle" style="font-size: 13px; fill:#166534;">• 近似最近邻搜索</text>
    <text x="150" y="140" text-anchor="middle" class="score-text">Score: 0.78</text>
  </g>
  
  <path d="M 300 275 L 350 275" class="arrow"/>
  <path d="M 750 275 L 800 275" class="arrow"/>
  
  <g transform="translate(800, 200)">
    <text x="150" y="-30" text-anchor="middle" class="subtitle" style="font-size: 20px; fill:#fcd34d;">加权融合</text>
    <rect x="50" y="0" width="300" height="150" class="fusion-box"/>
    <text x="150" y="30" text-anchor="middle" style="font-size: 13px; fill:#92400e; font-weight:bold;">Reciprocal Rank Fusion</text>
    <text x="150" y="55" text-anchor="middle" style="font-size: 13px; fill:#92400e;">或 Weighted Sum</text>
    <rect x="80" y="70" width="240" height="35" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
    <text x="200" y="92" text-anchor="middle" class="score-text" style="font-size: 16px; font-weight:bold;">Final = α·S_bm25 + β·S_vector</text>
    <text x="150" y="125" text-anchor="middle" style="font-size: 12px; fill:#92400e;">α=0.4, β=0.6 (可调参数)</text>
  </g>
  
  <g transform="translate(200, 420)">
    <rect x="0" y="0" width="800" height="140" fill="#ffffff" fill-opacity="0.15" stroke="#fbbf24" stroke-width="2" rx="12"/>
    <text x="400" y="30" text-anchor="middle" class="subtitle" style="font-size: 20px; fill:#fbbf24; font-weight:bold;">为什么需要混合检索？</text>
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="340" height="70" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="6"/>
      <text x="170" y="25" text-anchor="middle" style="font-size: 13px; fill:#991b1b; font-weight:bold;">❌ 单一向量检索的缺陷</text>
      <text x="170" y="45" text-anchor="middle" style="font-size: 12px; fill:#991b1b;">专有名词、数字匹配不准确</text>
      <text x="170" y="60" text-anchor="middle" style="font-size: 12px; fill:#991b1b;">无法精确控制关键词权重</text>
      <rect x="380" y="0" width="340" height="70" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="6"/>
      <text x="550" y="25" text-anchor="middle" style="font-size: 13px; fill:#166534; font-weight:bold;">✅ 混合检索的优势</text>
      <text x="550" y="45" text-anchor="middle" style="font-size: 12px; fill:#166534;">BM25 保证精确匹配，向量捕捉语义关联</text>
      <text x="550" y="60" text-anchor="middle" style="font-size: 12px; fill:#166534;">召回率提升 30-50%，MRR 提升 25%+</text>
    </g>
  </g>
  
  <text x="600" y="590" text-anchor="middle" class="subtitle" style="font-size: 18px; fill: #fbbf24;">AI 技术演进与核心算法实战 | 第十三篇</text>
</svg>
