<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  <text x="600" y="80" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Function Calling 原理</text>
  <text x="600" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="28" fill="#e0e7ff" text-anchor="middle">从 Prompt 伪装到原生支持的技术演进</text>
  <g transform="translate(150,180)">
    <rect x="0" y="0" width="280" height="140" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="140" y="35" font-family="system-ui" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Prompt 伪装阶段</text>
    <text x="140" y="65" font-family="system-ui" font-size="13" fill="#64748b" text-anchor="middle">"请调用 weather_api"</text>
    <text x="140" y="90" font-family="system-ui" font-size="13" fill="#64748b" text-anchor="middle">函数名：weather_api</text>
    <text x="140" y="115" font-family="system-ui" font-size="13" fill="#64748b" text-anchor="middle">参数：{"city": "Beijing"}</text>
  </g>
  <g transform="translate(460,180)">
    <rect x="0" y="0" width="280" height="140" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="140" y="35" font-family="system-ui" font-size="18" font-weight="bold" fill="#0369a1" text-anchor="middle">JSON Schema 约束</text>
    <text x="140" y="65" font-family="system-ui" font-size="13" fill="#0284c7" text-anchor="middle">强制结构化输出</text>
    <text x="140" y="90" font-family="system-ui" font-size="12" fill="#0284c7" text-anchor="middle">{</text>
    <text x="140" y="110" font-family="monospace" font-size="11" fill="#0284c7" text-anchor="middle">"name":"weather_api",</text>
    <text x="140" y="128" font-family="monospace" font-size="11" fill="#0284c7" text-anchor="middle">"arguments":{...}</text>
  </g>
  <g transform="translate(770,180)">
    <rect x="0" y="0" width="280" height="140" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5" rx="12" filter="url(#shadow)"/>
    <text x="140" y="35" font-family="system-ui" font-size="18" font-weight="bold" fill="#16a34a" text-anchor="middle">原生 Function Calling</text>
    <text x="140" y="65" font-family="system-ui" font-size="13" fill="#15803d" text-anchor="middle">模型内置工具理解</text>
    <rect x="30" y="75" width="220" height="50" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="6"/>
    <text x="140" y="95" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle">&lt;tool_call&gt;</text>
    <text x="140" y="112" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle">weather_api(city="Beijing")</text>
    <text x="140" y="127" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle">&lt;/tool_call&gt;</text>
  </g>
  <path d="M 430 250 L 455 250" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-right)"/>
  <path d="M 740 250 L 765 250" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-right)"/>
  <defs>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
  <g transform="translate(200,360)">
    <rect x="0" y="0" width="800" height="220" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" rx="12" filter="url(#shadow)"/>
    <text x="400" y="35" font-family="system-ui" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">参数绑定机制：从自然语言到函数签名</text>
    <g transform="translate(40,60)">
      <rect x="0" y="0" width="340" height="60" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" rx="6"/>
      <text x="170" y="25" font-family="system-ui" font-size="14" fill="#78350f" text-anchor="middle">用户请求："帮我查一下北京的天气"</text>
      <text x="170" y="48" font-family="system-ui" font-size="12" fill="#92400e" text-anchor="middle">意图识别 → 槽位填充 → 参数验证</text>
    </g>
    <path d="M 350 90 L 390 90" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
    <defs>
      <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
      </marker>
    </defs>
    <g transform="translate(400,60)">
      <rect x="0" y="0" width="360" height="60" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" rx="6"/>
      <text x="180" y="25" font-family="monospace" font-size="12" fill="#1e40af" text-anchor="middle">weather_api(location="Beijing",</text>
      <text x="180" y="48" font-family="monospace" font-size="12" fill="#1e40af" text-anchor="middle">unit="celsius", lang="zh")</text>
    </g>
    <path d="M 590 125 L 590 145" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
    <g transform="translate(400,150)">
      <rect x="0" y="0" width="360" height="55" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" rx="6"/>
      <text x="180" y="22" font-family="system-ui" font-size="13" fill="#6d28d9" text-anchor="middle">类型检查：location=String ✓</text>
      <text x="180" y="43" font-family="system-ui" font-size="13" fill="#6d28d9" text-anchor="middle">必填验证：location 存在 ✓</text>
    </g>
    <text x="400" y="200" font-family="system-ui" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">核心挑战：歧义消解 · 类型转换 · 默认值处理 · 错误恢复</text>
  </g>
</svg>
