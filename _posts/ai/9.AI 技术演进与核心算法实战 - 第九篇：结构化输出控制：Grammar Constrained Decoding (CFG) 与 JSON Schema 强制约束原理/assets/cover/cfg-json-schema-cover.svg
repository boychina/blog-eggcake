<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Title text -->
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">Grammar Constrained Decoding</text>
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="20" fill="#e0e7ff" text-anchor="middle" dominant-baseline="middle">结构化输出控制与 JSON Schema 约束</text>
  
  <!-- Left side: CFG Tree -->
  <g transform="translate(100, 180)">
    <!-- Root node -->
    <rect x="100" y="0" width="100" height="40" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" rx="6"/>
    <text x="150" y="20" font-family="Arial" font-size="14" fill="#78350f" text-anchor="middle" dominant-baseline="middle" font-weight="bold">JsonObject</text>
    
    <!-- Edges -->
    <line x1="150" y1="40" x2="50" y2="80" stroke="#94a3b8" stroke-width="2"/>
    <line x1="150" y1="40" x2="150" y2="80" stroke="#94a3b8" stroke-width="2"/>
    <line x1="150" y1="40" x2="250" y2="80" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Level 2 -->
    <rect x="20" y="80" width="60" height="35" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" rx="4"/>
    <text x="50" y="100" font-family="Arial" font-size="13" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">{</text>
    
    <rect x="100" y="80" width="100" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="6"/>
    <text x="150" y="100" font-family="Arial" font-size="14" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Members</text>
    
    <rect x="220" y="80" width="60" height="35" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" rx="4"/>
    <text x="250" y="100" font-family="Arial" font-size="13" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">}</text>
    
    <!-- Level 3 -->
    <line x1="150" y1="120" x2="100" y2="160" stroke="#94a3b8" stroke-width="2"/>
    <line x1="150" y1="120" x2="200" y2="160" stroke="#94a3b8" stroke-width="2"/>
    
    <rect x="50" y="160" width="100" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="6"/>
    <text x="100" y="180" font-family="Arial" font-size="13" fill="#1e40af" text-anchor="middle" dominant-baseline="middle" font-weight="bold">KeyValue</text>
    
    <rect x="150" y="160" width="100" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="6"/>
    <text x="200" y="180" font-family="Arial" font-size="13" fill="#78350f" text-anchor="middle" dominant-baseline="middle" font-weight="bold">STRING</text>
  </g>
  
  <!-- Right side: JSON Example -->
  <g transform="translate(420, 180)">
    <rect x="0" y="0" width="280" height="240" fill="#1e293b" stroke="#475569" stroke-width="2" rx="8"/>
    <text x="140" y="25" font-family="Courier New" font-size="14" fill="#22c55e" text-anchor="middle" dominant-baseline="middle" font-weight="bold">JSON Output</text>
    
    <!-- JSON content -->
    <text x="20" y="55" font-family="Courier New" font-size="13" fill="#fbbf24">{</text>
    <text x="40" y="80" font-family="Courier New" font-size="13" fill="#60a5fa">"name"</text>
    <text x="110" y="80" font-family="Courier New" font-size="13" fill="#94a3b8">:</text>
    <text x="130" y="80" font-family="Courier New" font-size="13" fill="#34d399">"张三"</text>
    <text x="200" y="80" font-family="Courier New" font-size="13" fill="#94a3b8">,</text>
    
    <text x="40" y="110" font-family="Courier New" font-size="13" fill="#60a5fa">"age"</text>
    <text x="100" y="110" font-family="Courier New" font-size="13" fill="#94a3b8">:</text>
    <text x="120" y="110" font-family="Courier New" font-size="13" fill="#f472b6">25</text>
    <text x="150" y="110" font-family="Courier New" font-size="13" fill="#94a3b8">,</text>
    
    <text x="40" y="140" font-family="Courier New" font-size="13" fill="#60a5fa">"email"</text>
    <text x="120" y="140" font-family="Courier New" font-size="13" fill="#94a3b8">:</text>
    <text x="140" y="140" font-family="Courier New" font-size="13" fill="#34d399">"zhang@example.com"</text>
    <text x="20" y="170" font-family="Courier New" font-size="13" fill="#fbbf24">}</text>
    
    <!-- Constraint badge -->
    <rect x="20" y="190" width="240" height="35" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="140" y="207" font-family="Arial" font-size="12" fill="#6ee7b7" text-anchor="middle" dominant-baseline="middle" font-weight="bold">✓ 100% Valid JSON</text>
    <text x="140" y="225" font-family="Arial" font-size="11" fill="#6ee7b7" text-anchor="middle" dominant-baseline="middle">Schema Constrained</text>
  </g>
  
  <!-- Bottom: Key concepts -->
  <g transform="translate(100, 460)">
    <rect x="0" y="0" width="600" height="110" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="2" rx="8"/>
    
    <!-- Concept 1 -->
    <circle cx="60" cy="55" r="25" fill="#3b82f6" opacity="0.8"/>
    <text x="60" y="50" font-family="Arial" font-size="20" fill="white" text-anchor="middle" dominant-baseline="middle" font-weight="bold">CFG</text>
    <text x="60" y="95" font-family="Arial" font-size="11" fill="#e0e7ff" text-anchor="middle" dominant-baseline="middle">上下文无关文法</text>
    
    <!-- Arrow -->
    <line x1="100" y1="55" x2="130" y2="55" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Concept 2 -->
    <circle cx="180" cy="55" r="25" fill="#8b5cf6" opacity="0.8"/>
    <text x="180" y="50" font-family="Arial" font-size="16" fill="white" text-anchor="middle" dominant-baseline="middle" font-weight="bold">PDA</text>
    <text x="180" y="95" font-family="Arial" font-size="11" fill="#e0e7ff" text-anchor="middle" dominant-baseline="middle">下推自动机</text>
    
    <!-- Arrow -->
    <line x1="220" y1="55" x2="250" y2="55" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Concept 3 -->
    <circle cx="300" cy="55" r="25" fill="#ec4899" opacity="0.8"/>
    <text x="300" y="50" font-family="Arial" font-size="14" fill="white" text-anchor="middle" dominant-baseline="middle" font-weight="bold">FIRST</text>
    <text x="300" y="95" font-family="Arial" font-size="11" fill="#e0e7ff" text-anchor="middle" dominant-baseline="middle">合法 Token 集合</text>
    
    <!-- Arrow -->
    <line x1="340" y1="55" x2="370" y2="55" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Concept 4 -->
    <circle cx="420" cy="55" r="25" fill="#10b981" opacity="0.8"/>
    <text x="420" y="50" font-family="Arial" font-size="18" fill="white" text-anchor="middle" dominant-baseline="middle" font-weight="bold">✓</text>
    <text x="420" y="95" font-family="Arial" font-size="11" fill="#e0e7ff" text-anchor="middle" dominant-baseline="middle">格式正确</text>
    
    <!-- Arrow marker -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
      </marker>
    </defs>
  </g>
  
  <!-- Series info -->
  <rect x="0" y="570" width="800" height="30" fill="rgba(0,0,0,0.3)"/>
  <text x="400" y="585" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">AI 技术演进与核心算法实战 | 第九篇 | 第二模块：交互篇</text>
</svg>
