<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg-gradient)"/>
  <text x="400" y="60" font-family="-apple-system, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">解码策略详解</text>
  <text x="400" y="95" font-family="-apple-system, sans-serif" font-size="18" fill="#e0e7ff" text-anchor="middle">Temperature, Top-P, Top-K 对生成多样性的影响</text>
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="180" height="140" fill="#f8fafc" rx="8" opacity="0.95"/>
    <text x="90" y="30" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Temperature</text>
    <line x1="20" y1="50" x2="160" y2="50" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M 20 110 Q 60 100, 100 80 T 160 60" stroke="#ef4444" stroke-width="3" fill="none" filter="url(#glow)"/>
    <text x="90" y="130" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">高温→更随机</text>
  </g>
  <g transform="translate(310, 150)">
    <rect x="0" y="0" width="180" height="140" fill="#f8fafc" rx="8" opacity="0.95"/>
    <text x="90" y="30" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Top-P</text>
    <line x1="20" y1="50" x2="160" y2="50" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="30" y="60" width="100" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="80" y="85" font-family="-apple-system, sans-serif" font-size="11" fill="#92400e" text-anchor="middle">累积概率 0.9</text>
    <text x="90" y="130" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">动态截断</text>
  </g>
  <g transform="translate(520, 150)">
    <rect x="0" y="0" width="180" height="140" fill="#f8fafc" rx="8" opacity="0.95"/>
    <text x="90" y="30" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">Top-K</text>
    <line x1="20" y1="50" x2="160" y2="50" stroke="#cbd5e1" stroke-width="2"/>
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="16" height="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="2"/>
      <rect x="20" y="5" width="16" height="25" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="2"/>
      <rect x="40" y="10" width="16" height="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="2"/>
      <rect x="60" y="15" width="16" height="15" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="2"/>
      <rect x="80" y="18" width="16" height="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="2"/>
    </g>
    <text x="90" y="130" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">固定候选数</text>
  </g>
  <g transform="translate(200, 340)">
    <rect x="0" y="0" width="400" height="120" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="8"/>
    <text x="200" y="30" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#166534" text-anchor="middle">多样性 vs 质量的权衡</text>
    <path d="M 40 90 L 360 90" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 40 90 L 40 60" stroke="#94a3b8" stroke-width="2"/>
    <text x="40" y="110" font-family="-apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">低多样性</text>
    <text x="360" y="110" font-family="-apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle">高多样性</text>
    <ellipse cx="120" cy="75" rx="30" ry="15" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="120" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#166534" text-anchor="middle">事实性</text>
    <ellipse cx="200" cy="70" rx="30" ry="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="75" font-family="-apple-system, sans-serif" font-size="11" fill="#92400e" text-anchor="middle">创造性</text>
    <ellipse cx="280" cy="75" rx="30" ry="15" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="280" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle">高风险</text>
  </g>
</svg>
