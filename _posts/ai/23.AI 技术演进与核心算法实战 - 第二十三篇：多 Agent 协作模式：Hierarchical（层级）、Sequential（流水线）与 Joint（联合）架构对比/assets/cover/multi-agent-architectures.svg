<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bg { fill: url(#gradient); }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 48px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 28px; fill: #e0f2fe; text-anchor: middle; }
      .series { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 20px; fill: #bae6fd; text-anchor: middle; }
      .agent-box { fill: rgba(255, 255, 255, 0.15); stroke: #ffffff; stroke-width: 3; rx: 15; ry: 15; }
      .connection { stroke: #60a5fa; stroke-width: 3; stroke-dasharray: 8,6; opacity: 0.7; }
      .arrow { fill: #60a5fa; }
    </style>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" class="bg"/>
  
  <!-- Decorative elements - Network connections -->
  <line x1="200" y1="200" x2="400" y2="150" class="connection"/>
  <line x1="400" y1="150" x2="600" y2="200" class="connection"/>
  <line x1="600" y1="200" x2="800" y2="150" class="connection"/>
  <line x1="200" y1="200" x2="300" y2="350" class="connection"/>
  <line x1="400" y1="150" x2="500" y2="350" class="connection"/>
  <line x1="600" y1="200" x2="700" y2="350" class="connection"/>
  <line x1="800" y1="150" x2="900" y2="350" class="connection"/>
  <line x1="300" y1="350" x2="500" y2="350" class="connection"/>
  <line x1="500" y1="350" x2="700" y2="350" class="connection"/>
  <line x1="700" y1="350" x2="900" y2="350" class="connection"/>
  
  <!-- Agent nodes -->
  <rect x="150" y="170" width="100" height="60" class="agent-box"/>
  <text x="200" y="205" fill="white" font-size="16" text-anchor="middle" font-weight="bold">Agent 1</text>
  
  <rect x="350" y="120" width="100" height="60" class="agent-box"/>
  <text x="400" y="155" fill="white" font-size="16" text-anchor="middle" font-weight="bold">Agent 2</text>
  
  <rect x="550" y="170" width="100" height="60" class="agent-box"/>
  <text x="600" y="205" fill="white" font-size="16" text-anchor="middle" font-weight="bold">Agent 3</text>
  
  <rect x="750" y="120" width="100" height="60" class="agent-box"/>
  <text x="800" y="155" fill="white" font-size="16" text-anchor="middle" font-weight="bold">Agent 4</text>
  
  <rect x="250" y="320" width="100" height="60" class="agent-box"/>
  <text x="300" y="355" fill="white" font-size="16" text-anchor="middle" font-weight="bold">Agent 5</text>
  
  <rect x="450" y="320" width="100" height="60" class="agent-box"/>
  <text x="500" y="355" fill="white" font-size="16" text-anchor="middle" font-weight="bold">Agent 6</text>
  
  <rect x="650" y="320" width="100" height="60" class="agent-box"/>
  <text x="700" y="355" fill="white" font-size="16" text-anchor="middle" font-weight="bold">Agent 7</text>
  
  <rect x="850" y="320" width="100" height="60" class="agent-box"/>
  <text x="900" y="355" fill="white" font-size="16" text-anchor="middle" font-weight="bold">Agent 8</text>
  
  <!-- Series label -->
  <text x="600" y="80" class="series">AI 技术演进与核心算法实战 | 第二十三篇</text>
  
  <!-- Main title -->
  <text x="600" y="470" class="title">多 Agent 协作模式</text>
  
  <!-- Subtitle -->
  <text x="600" y="520" class="subtitle">Hierarchical · Sequential · Joint 架构对比</text>
  
  <!-- Bottom decorative line -->
  <line x1="300" y1="570" x2="900" y2="570" stroke="#60a5fa" stroke-width="4" opacity="0.5"/>
  
  <!-- Small icons representing three architectures -->
  <!-- Hierarchical icon (pyramid) -->
  <polygon points="150,580 170,550 190,580" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="170" y="600" fill="#bae6fd" font-size="12" text-anchor="middle">层级式</text>
  
  <!-- Sequential icon (chain) -->
  <circle cx="590" cy="565" r="8" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <line x1="602" y1="565" x2="618" y2="565" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="622" cy="565" r="8" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <line x1="634" y1="565" x2="650" y2="565" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="654" cy="565" r="8" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="620" y="600" fill="#bae6fd" font-size="12" text-anchor="middle">流水线式</text>
  
  <!-- Joint icon (network) -->
  <circle cx="1020" cy="565" r="10" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="1050" cy="565" r="10" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="1035" cy="545" r="10" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <line x1="1028" y1="562" x2="1042" y2="562" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="1025" y1="555" x2="1032" y2="548" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="1045" y1="555" x2="1038" y2="548" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1035" y="600" fill="#bae6fd" font-size="12" text-anchor="middle">联合式</text>
</svg>
