<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-gradient)"/>
  
  <!-- Title -->
  <text x="400" y="60" font-family="-apple-system, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Graph RAG 新范式</text>
  <text x="400" y="95" font-family="-apple-system, sans-serif" font-size="18" fill="#e0e7ff" text-anchor="middle">利用知识图谱增强全局理解与多跳推理能力</text>
  
  <!-- Knowledge Graph Visualization -->
  <g transform="translate(400, 250)" filter="url(#glow)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="35" fill="#fbbf24" stroke="#f59e0b" stroke-width="3"/>
    <text x="0" y="5" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">查询</text>
    
    <!-- First layer nodes -->
    <circle cx="-120" cy="-80" r="28" fill="#60a5fa" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="-120" y="-75" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">实体 1</text>
    
    <circle cx="120" cy="-80" r="28" fill="#60a5fa" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="120" y="-75" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">实体 2</text>
    
    <circle cx="0" cy="100" r="28" fill="#60a5fa" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="0" y="105" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a" text-anchor="middle">实体 3</text>
    
    <!-- Second layer nodes -->
    <circle cx="-200" cy="-140" r="22" fill="#a78bfa" stroke="#8b5cf6" stroke-width="2"/>
    <text x="-200" y="-135" font-family="-apple-system, sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle">属性</text>
    
    <circle cx="-80" cy="-160" r="22" fill="#a78bfa" stroke="#8b5cf6" stroke-width="2"/>
    <text x="-80" y="-155" font-family="-apple-system, sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle">关系</text>
    
    <circle cx="80" cy="-160" r="22" fill="#a78bfa" stroke="#8b5cf6" stroke-width="2"/>
    <text x="80" y="-155" font-family="-apple-system, sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle">属性</text>
    
    <circle cx="200" cy="-140" r="22" fill="#a78bfa" stroke="#8b5cf6" stroke-width="2"/>
    <text x="200" y="-135" font-family="-apple-system, sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle">关系</text>
    
    <circle cx="-100" cy="160" r="22" fill="#a78bfa" stroke="#8b5cf6" stroke-width="2"/>
    <text x="-100" y="165" font-family="-apple-system, sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle">推论</text>
    
    <circle cx="100" cy="160" r="22" fill="#a78bfa" stroke="#8b5cf6" stroke-width="2"/>
    <text x="100" y="165" font-family="-apple-system, sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle">结论</text>
    
    <!-- Connections -->
    <line x1="0" y1="0" x2="-120" y2="-80" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="120" y2="-80" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
    
    <line x1="-120" y1="-80" x2="-200" y2="-140" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
    <line x1="-120" y1="-80" x2="-80" y2="-160" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
    <line x1="120" y1="-80" x2="80" y2="-160" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
    <line x1="120" y1="-80" x2="200" y2="-140" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="100" x2="-100" y2="160" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="100" x2="100" y2="160" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Bottom labels -->
  <text x="400" y="380" font-family="-apple-system, sans-serif" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="bold">从"检索碎片"到"理解全局"</text>
  <text x="400" y="410" font-family="-apple-system, sans-serif" font-size="14" fill="#e0e7ff" text-anchor="middle">多跳推理 · 全局理解 · 结构化知识</text>
</svg>
